# Tema común de las apps (diseño ecnt-frontend). La app EPS cambia el color primario a verde
# con --theme.primaryColor "#065F46" (ver scripts/iniciar_plataforma.ps1 y docker-compose.yml).
[theme]
base = "light"
primaryColor = "#1A365D"
backgroundColor = "#F1F5F9"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#1E293B"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

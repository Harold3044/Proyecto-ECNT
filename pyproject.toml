[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecnt"
version = "0.1.0"
description = "Plataforma de IA para estimar indicadores territoriales de ECNT asociados a determinantes sociales (Caribe colombiano)"
requires-python = ">=3.11"
authors = [{ name = "Grupo 05 — Harold Solano" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/generar_diccionario.py" = ["E501"]  # contiene tablas Markdown literales
"apps/**" = ["E501"]                          # textos de interfaz y marcado HTML
"src/ecnt_client/theme.py" = ["E501"]         # hoja de estilos CSS e iconos SVG

[tool.ruff.lint.flake8-bugbear]
# Patrón idiomático de FastAPI: dependencias declaradas como valores por defecto
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form",
                          "ecnt_api.security.require_roles"]
